# All connection settings and secrets come from environment variables (spec §9.3).
# Never put credentials in this file.
server:
  port: 8080

spring:
  application:
    name: sysarch-studio
  # P2 T7: a 10,000-element model document is about 1.3 MB; Spring's 1 MB default refused its upload in Sirius.
  servlet:
    multipart:
      max-file-size: ${SYSARCH_MAX_UPLOAD:50MB}
      max-request-size: ${SYSARCH_MAX_UPLOAD:50MB}
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    # Sirius Web's own schema (sirius-web-infrastructure) plus the sysarch tables (T7).
    change-log: classpath:db/sysarch.changelog-master.xml
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

sirius:
  web:
    enabled: "*"
  components:
    cors:
      allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
      allowedCredentials: true
      # Sirius sets no methods, so Spring allows only GET/HEAD/POST cross-origin. Browsers send an Origin header on
      # PUT/DELETE even through the :3000 proxy: the lock heartbeat and release (P2 T1) need these.
      allowedMethods: GET,HEAD,POST,PUT,DELETE

# Our own settings. sysarch.view is not read by any code yet.
sysarch:
  polarion:
    # e.g. http://localhost/polarion; the REST API is <base-url>/rest/v1. No token here: each caller's
    # Polarion token is passed through per request (Authorization: Bearer ...) and never stored.
    base-url: ${POLARION_BASE_URL:}
    rate-limit-rps: ${SYNC_RATE_LIMIT_RPS:10}
    max-retries: 3
    # Polarion project id (the API's projectId) -> Sirius project id or name. Set per deployment, e.g.
    # env SYSARCH_POLARION_PROJECTS_SYSARCH=project001 maps Polarion project "sysarch" to Sirius "project001".
    projects: {}
    # Polarion custom fields that hold the model-owned values (spec §6.2); must exist on the Work Item types.
    fields:
      element-id: sysarchElementId
      name: sysarchName
      layer: sysarchLayer
      stereotypes: sysarchStereotypes
      source: sysarchSource
      target: sysarchTarget
    # HMAC-SHA256 secret of Polarion webhooks (X-Polarion-Signature); unset = webhooks are refused (503).
    webhook-secret: ${POLARION_WEBHOOK_SECRET:}
    event-poll-ms: 2000
    # P1 T6: token of a Polarion service account, only for the scheduled pull (users' calls use their own token).
    # Set by operations in the environment; never stored or logged. Unset: no scheduled pull.
    sync-token: ${POLARION_SYNC_TOKEN:}
    # Satisfy / verify are pushed as native Polarion links: element Work Item <role> requirement Work Item.
    link-roles:
      satisfied-by: implements
      verified-by: verifies
    # Incremental pull: every interval; after a failure one retry after retry-delay; max-failures in a row pause it.
    schedule:
      interval: PT15M
      retry-delay: PT2M
      max-failures: 3
      tick: PT30S
  view:
    refresh-budget-ms: ${VIEW_REFRESH_BUDGET_MS:2000}
  consistency:
    # R2 repair strategy, MODEL_WINS or POLARION_WINS, fixed per project (spec §7). One project can override it
    # with sysarch.consistency.strategies.<polarion project>.
    strategy: ${CONSISTENCY_STRATEGY:}
