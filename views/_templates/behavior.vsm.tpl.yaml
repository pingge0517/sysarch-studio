vsm: "1.0"
viewpoint:
  id: "sysarch.core"
  label: "系统架构建模"
  metamodelUri: "http://example.com/sysarch/1.0"
  priority: 10

representations:
  - id: "${id}"
    label: "${label}"
    kind: "diagram"
    domainClass: "sysarch:${rootClass}"
    synchronization: "auto"
    refresh:
      mode: "incremental"
      budgetMs: 2000
    partitionSize: ${partitionSize}
    layoutDirection: "RIGHT"
    autoExpand:
      - feature: "${nodesFeature}"
        maxDepth: 1
    nodeStyles:
      - id: "${nodeStyle}"
        appliesTo: "sysarch:${nodeClass}"
        shape: "${nodeShape}"
        color: "#FFFFFF"
        borderColor: "#1A2B4A"
        labelExpression: "{name}"
        subLabelExpression: "${nodeDetail}"
      ${moreNodeStyles}
    edgeStyles:
      - id: "${edgeStyle}"
        domainClass: "sysarch:${edgeClass}"
        sourceEnd: "${edgeSource}"
        targetEnd: "${edgeTarget}"
        routing: "straight"
        arrow: "${edgeArrow}"
        lineStyle: "solid"
        color: "#1A2B4A"
        labelExpression: "${edgeLabel}"
      ${moreEdgeStyles}
    tools:
      - id: "${createNodeTool}"
        label: "${createNodeLabel}"
        action: "create-child"
        targetClass: "sysarch:${nodeClass}"
        ${nodeContainment}
      ${moreTools}
      - id: "${connectTool}"
        label: "${connectLabel}"
        action: "create-edge"
        targetClass: "sysarch:${edgeClass}"
        ${edgeContainment}
        validateOnDrop: true
