vsm: "1.0"
viewpoint:
  id: "sysarch.core"
  label: "系统架构建模"
  metamodelUri: "http://example.com/sysarch/1.0"
  priority: 10

representations:
  - id: "la-architecture"
    label: "逻辑架构（LA）"
    kind: "diagram"
    domainClass: "sysarch:PartDefinition"
    synchronization: "auto"
    refresh:
      mode: "incremental"
      budgetMs: 2000
    filters:
      - id: "onlyLogical"
        label: "仅逻辑层"
        expression: "layer == 'LOGICAL'"
    autoExpand:
      - feature: "ownedParts"
        maxDepth: 2
      - feature: "ownedPorts"
        maxDepth: 1
    nodeStyles:
      - id: "function"
        appliesTo: "sysarch:PartDefinition"
        shape: "rounded-rectangle"
        color: "#FFFFFF"
        borderColor: "#2F5D4A"
        labelExpression: "{name}"
        subLabelExpression: "{stereotypes}"
      - id: "role"
        appliesTo: "sysarch:PartDefinition"
        shape: "rectangle"
        color: "#EEF4F1"
        borderColor: "#83998F"
        labelExpression: "{name}"
    edgeStyles:
      - id: "exchange"
        domainClass: "sysarch:Connection"
        sourceEnd: "source"
        targetEnd: "target"
        routing: "spline"
        color: "#2F5D4A"
        arrow: "open"
        labelExpression: "{interfaceType.name}"
    tools:
      - id: "createFunction"
        label: "新建逻辑组件"
        action: "create-child"
        targetClass: "sysarch:Part"
        containmentFeature: "ownedParts"
        defaults:
          layer: "LOGICAL"
      - id: "connect"
        label: "建立逻辑交互"
        action: "create-edge"
        targetClass: "sysarch:Connection"
        validateOnDrop: true
