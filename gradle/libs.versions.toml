# Versions are locked for the whole of P0 (spec §2.1). Do not bump without review.
[versions]
java = "21"
# Spec §2.1 says 3.3.x "aligned with the Sirius Web starter"; Sirius Web 2025.8.x is
# built on Spring Boot 3.5.5 (sirius-web-parent), so 3.5.5 is the aligned version.
spring-boot = "3.5.5"
sirius-web = "2025.8.11"
# EMF runtime = the versions Sirius Web 2025.8.11 ships (sirius-components-emf). Spec §2.1 says
# EMF 2.35; Gradle would upgrade a 2.35 pin to Sirius Web's versions anyway, so the generated
# code targets the 2.35 API level instead (GenModel runtimeVersion=2.35).
emf-common = "2.31.0"
emf-ecore = "2.37.0"
emf-ecore-xmi = "2.38.0"
emf-edit = "2.22.0"
# Headless code generation only (metamodel module). codegen 2.24.0 is the newest that runs
# on emf-common 2.31.
emf-codegen = "2.24.0"
emf-codegen-ecore = "2.38.0"
jdt-core = "3.38.0"
# vsm-compiler. snakeyaml, freemarker, jackson and slf4j versions come from the Spring Boot BOM.
json-schema-validator = "1.5.9"
# Eclipse OCL 6.19.0 (Pivot 1.19, Dec 2023) from its p2 site, and the Xtext release it was built with.
ocl-p2 = "1.19.0.v20231129-1236"
xtext = "2.33.0"
# P2 T5 reports: HTML (FreeMarker) to Word through docx4j's XHTML import (spec §4.1), and to PDF (user's decision, for
# the page count) through openhtmltopdf, pinned to the version docx4j-ImportXHTML 17.3.5 is built on (1.1.110 broke its
# page-break handling: NPE on page-break-after). docx4j 17 is the Jakarta JAXB line, as Spring Boot 3.
docx4j = "17.3.6"
docx4j-import-xhtml = "17.3.5"
openhtmltopdf = "1.1.103"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
sirius-web-starter = { module = "org.eclipse.sirius:sirius-web-starter", version.ref = "sirius-web" }
# Sirius Web's own prebuilt React frontend (static/ resources), served by the backend on :8080.
sirius-web-frontend = { module = "org.eclipse.sirius:sirius-web-frontend", version.ref = "sirius-web" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
spring-context = { module = "org.springframework:spring-context" }

snakeyaml = { module = "org.yaml:snakeyaml" }
freemarker = { module = "org.freemarker:freemarker" }
docx4j-jaxb = { module = "org.docx4j:docx4j-JAXB-ReferenceImpl", version.ref = "docx4j" }
docx4j-import-xhtml = { module = "org.docx4j:docx4j-ImportXHTML-core", version.ref = "docx4j-import-xhtml" }
openhtmltopdf-pdfbox = { module = "io.github.openhtmltopdf:openhtmltopdf-pdfbox", version.ref = "openhtmltopdf" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
slf4j-nop = { module = "org.slf4j:slf4j-nop" }
# T7 tests: a mock Polarion server, and an in-memory database for PolarionSyncIT (version from the Spring Boot BOM).
wiremock = { module = "org.wiremock:wiremock-standalone", version = "3.13.2" }
h2 = { module = "com.h2database:h2" }

emf-common = { module = "org.eclipse.emf:org.eclipse.emf.common", version.ref = "emf-common" }
emf-ecore = { module = "org.eclipse.emf:org.eclipse.emf.ecore", version.ref = "emf-ecore" }
emf-ecore-xmi = { module = "org.eclipse.emf:org.eclipse.emf.ecore.xmi", version.ref = "emf-ecore-xmi" }
emf-edit = { module = "org.eclipse.emf:org.eclipse.emf.edit", version.ref = "emf-edit" }
emf-codegen = { module = "org.eclipse.emf:org.eclipse.emf.codegen", version.ref = "emf-codegen" }
emf-codegen-ecore = { module = "org.eclipse.emf:org.eclipse.emf.codegen.ecore", version.ref = "emf-codegen-ecore" }
# EMF's Java merger (JControlModel) loads the JDT AST even on a fresh generation.
jdt-core = { module = "org.eclipse.jdt:org.eclipse.jdt.core", version.ref = "jdt-core" }
jdt-ecj = { module = "org.eclipse.jdt:ecj", version.ref = "jdt-core" }
eclipse-core-resources = { module = "org.eclipse.platform:org.eclipse.core.resources", version = "3.20.200" }
eclipse-core-runtime = { module = "org.eclipse.platform:org.eclipse.core.runtime", version = "3.31.100" }
eclipse-core-jobs = { module = "org.eclipse.platform:org.eclipse.core.jobs", version = "3.15.300" }
eclipse-core-contenttype = { module = "org.eclipse.platform:org.eclipse.core.contenttype", version = "3.9.400" }
eclipse-core-commands = { module = "org.eclipse.platform:org.eclipse.core.commands", version = "3.12.100" }
eclipse-core-filesystem = { module = "org.eclipse.platform:org.eclipse.core.filesystem", version = "1.10.400" }
eclipse-text = { module = "org.eclipse.platform:org.eclipse.text", version = "3.14.100" }
eclipse-osgi = { module = "org.eclipse.platform:org.eclipse.osgi", version = "3.20.0" }
eclipse-equinox-common = { module = "org.eclipse.platform:org.eclipse.equinox.common", version = "3.19.100" }
eclipse-equinox-preferences = { module = "org.eclipse.platform:org.eclipse.equinox.preferences", version = "3.11.100" }
eclipse-equinox-registry = { module = "org.eclipse.platform:org.eclipse.equinox.registry", version = "3.12.100" }
eclipse-equinox-app = { module = "org.eclipse.platform:org.eclipse.equinox.app", version = "1.7.100" }
osgi-service-prefs = { module = "org.osgi:org.osgi.service.prefs", version = "1.1.2" }

# Eclipse OCL Pivot (T6). "eclipse.ocl.p2" is the pseudo-group of the p2 ivy repository in settings.gradle.kts.
ocl-pivot = { module = "eclipse.ocl.p2:org.eclipse.ocl.pivot", version.ref = "ocl-p2" }
ocl-common = { module = "eclipse.ocl.p2:org.eclipse.ocl.common", version.ref = "ocl-p2" }
ocl-xtext-base = { module = "eclipse.ocl.p2:org.eclipse.ocl.xtext.base", version.ref = "ocl-p2" }
ocl-xtext-essentialocl = { module = "eclipse.ocl.p2:org.eclipse.ocl.xtext.essentialocl", version.ref = "ocl-p2" }
xtext = { module = "org.eclipse.xtext:org.eclipse.xtext", version.ref = "xtext" }
xtext-util = { module = "org.eclipse.xtext:org.eclipse.xtext.util", version.ref = "xtext" }
xtext-xbase-lib = { module = "org.eclipse.xtext:org.eclipse.xtext.xbase.lib", version.ref = "xtext" }
xtend-lib = { module = "org.eclipse.xtend:org.eclipse.xtend.lib", version.ref = "xtext" }
xtend-lib-macro = { module = "org.eclipse.xtend:org.eclipse.xtend.lib.macro", version.ref = "xtext" }
guice = { module = "com.google.inject:guice", version = "7.0.0" }
jakarta-inject = { module = "jakarta.inject:jakarta.inject-api", version = "2.0.1" }
aopalliance = { module = "aopalliance:aopalliance", version = "1.0" }
guava = { module = "com.google.guava:guava", version = "32.1.3-jre" }
guava-failureaccess = { module = "com.google.guava:failureaccess", version = "1.0.1" }
reload4j = { module = "ch.qos.reload4j:reload4j", version = "1.2.25" }
antlr3-runtime = { module = "org.antlr:antlr-runtime", version = "3.2" }

[bundles]
emf-runtime = ["emf-common", "emf-ecore", "emf-ecore-xmi", "emf-edit"]
emf-codegen = [
    "emf-common", "emf-ecore", "emf-ecore-xmi", "emf-edit", "emf-codegen", "emf-codegen-ecore",
    "jdt-core", "jdt-ecj", "eclipse-core-resources", "eclipse-core-runtime", "eclipse-core-jobs",
    "eclipse-core-contenttype", "eclipse-core-commands", "eclipse-core-filesystem", "eclipse-text",
    "eclipse-osgi", "eclipse-equinox-common", "eclipse-equinox-preferences", "eclipse-equinox-registry",
    "eclipse-equinox-app", "osgi-service-prefs",
]
# Exact runtime set verified for standalone Pivot (T6). Add it non-transitively: the Eclipse poms use open
# version ranges. The five platform jars are needed only so classes load; no Eclipse workspace runs.
ocl-runtime = [
    "ocl-pivot", "ocl-common", "ocl-xtext-base", "ocl-xtext-essentialocl",
    "xtext", "xtext-util", "xtext-xbase-lib", "xtend-lib", "xtend-lib-macro",
    "guice", "jakarta-inject", "aopalliance", "guava", "guava-failureaccess", "reload4j", "antlr3-runtime",
    "eclipse-equinox-common", "eclipse-core-resources", "eclipse-core-runtime", "eclipse-osgi", "eclipse-equinox-registry",
]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
# T7: generates the Polarion proxy API interfaces and DTOs from backend/src/main/resources/api/polarion-proxy.openapi.yaml
openapi-generator = { id = "org.openapi.generator", version = "7.27.0" }
