server {
    listen 3000;
    root /usr/share/nginx/html;
    # P2 T7/T8: model uploads and SysML imports of a 10,000-element model are over 1 MB (nginx's default).
    client_max_body_size 50m;
    # Embedding in Polarion: only this site and the local Polarion may frame these pages (the backend sends the same
    # policy, from SYSARCH_FRAME_ANCESTORS or POLARION_BASE_URL). Change the origin to your Polarion's.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' http://localhost" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri /index.html;
    }

    # The browser only talks to this origin. Backend routes are proxied, including the
    # GraphQL subscription websocket.
    location ~ ^/(api|graphql|actuator)(/|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /subscriptions {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
