server {
    listen 3000;
    root /usr/share/nginx/html;
    # P2 T7/T8: model uploads and SysML imports of a 10,000-element model are over 1 MB (nginx's default).
    client_max_body_size 50m;

    location / {
        try_files $uri /index.html;
    }

    # The browser only talks to this origin. Backend routes are proxied, including the
    # GraphQL subscription websocket.
    location ~ ^/(api|graphql|actuator)(/|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /subscriptions {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
