# CI (spec T9 step 3): three gates, all must be green.
#   1. gradle tests          ./gradlew test
#   2. VSM determinism       two generations and the committed view/generated have the same sha256
#   3. perf threshold        IbdSyncTest's refresh report: median < 800 ms, P95 < 2000 ms
# `./gradlew build` runs the same three (both gates hang off `check`), so a local build is the CI build.
#
# Sirius Web comes from GitHub Packages, which needs a *classic* PAT with read:packages even for public
# packages: add it as the repository secret GPR_TOKEN (and GPR_USER, its owner's login).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ secrets.GPR_USER }}
      GITHUB_TOKEN: ${{ secrets.GPR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      # P2 T5: report PDFs embed a CJK TrueType font (sysarch.report.fonts); Droid Sans Fallback is one on Ubuntu.
      - name: CJK font for report PDFs
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-droid-fallback

      - name: "Gate 1: gradle tests"
        run: ./gradlew test --console=plain

      - name: "Gate 2: VSM generation is deterministic (sha256)"
        run: ./gradlew :vsm-compiler:verifyDeterministicGeneration --console=plain && cat vsm-compiler/build/vsm-generation.sha256

      - name: "Gate 3: refresh perf threshold"
        run: ./gradlew :backend:checkPerfThreshold --console=plain

      - name: Full build
        run: ./gradlew build --console=plain

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            backend/build/perf-refresh.json
            vsm-compiler/build/vsm-generation.sha256
            **/build/reports/tests/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
