# CI (spec T9 step 3): three gates, all must be green (P4 T8 adds a fourth, the dependency scan, as its own job).
#   1. gradle tests          ./gradlew test
#   2. VSM determinism       two generations and the committed view/generated have the same sha256
#   3. perf threshold        IbdSyncTest's refresh report: median < 800 ms, P95 < 2000 ms
# `./gradlew build` runs the same three (both gates hang off `check`), so a local build is the CI build.
#
# Sirius Web comes from GitHub Packages, which needs a *classic* PAT with read:packages even for public
# packages: add it as the repository secret GPR_TOKEN (and GPR_USER, its owner's login).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ secrets.GPR_USER }}
      GITHUB_TOKEN: ${{ secrets.GPR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      # P2 T5: report PDFs embed a CJK TrueType font (sysarch.report.fonts); Droid Sans Fallback is one on Ubuntu.
      - name: CJK font for report PDFs
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-droid-fallback

      # P3 T4: the solver tests run the spec's solver/python_solver.py for real (NumPy + SciPy, the versions used locally)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: NumPy and SciPy for the solver tests
        run: |
          python -m pip install --quiet numpy==2.5.4 scipy==1.18.1
          echo "SYSARCH_SOLVER_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: "Gate 1: gradle tests"
        run: ./gradlew test --console=plain

      - name: "Gate 2: VSM generation is deterministic (sha256)"
        run: ./gradlew :vsm-compiler:verifyDeterministicGeneration --console=plain && cat vsm-compiler/build/vsm-generation.sha256

      - name: "Gate 3: refresh perf threshold"
        run: ./gradlew :backend:checkPerfThreshold --console=plain

      - name: Full build
        run: ./gradlew build --console=plain

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            backend/build/perf-refresh.json
            vsm-compiler/build/vsm-generation.sha256
            **/build/reports/tests/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.GPR_TOKEN }}   # Sirius Web's front-end packages (GitHub Packages), P4 T3
      - run: npm test
      - run: npm run build

  # P4 T8 (security review F6; spec P4 §5.2): dependency scan, high-severity vulnerabilities block the build.
  # Gradle has no lockfiles, so `osvLockfile` writes each module's resolved runtime dependencies for the scan; npm uses
  # frontend/package-lock.json. OSV-Scanner is pinned and checked against its published SHA-256. Ignored entries, each
  # with a reason and a review date: tools/osv/osv-scanner.toml. The scanner sends package names and versions (public
  # coordinates, no code) to the OSV database.
  dependency-scan:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ secrets.GPR_USER }}
      GITHUB_TOKEN: ${{ secrets.GPR_TOKEN }}
      OSV_SCANNER_VERSION: v2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolved Gradle dependencies for the scan
        run: ./gradlew osvLockfile --console=plain
      - name: OSV-Scanner (pinned, checksum verified)
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: "Gate 4: no high-severity vulnerability"
        run: |
          ./osv-scanner scan source --config tools/osv/osv-scanner.toml --format json \
            -L backend/build/osv/gradle.lockfile -L metamodel/build/osv/gradle.lockfile \
            -L vsm-compiler/build/osv/gradle.lockfile -L polarion-sso/build/osv/gradle.lockfile \
            -L frontend/package-lock.json > osv-results.json || true
          node tools/osv/gate.mjs osv-results.json
      - name: Scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-results
          path: osv-results.json
          if-no-files-found: ignore
