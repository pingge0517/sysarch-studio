# P4 T8 (security finding F6): weekly update proposals for the dependencies. Security alerts themselves are a repository
# setting (Settings → Code security → Dependabot alerts), switched on by the repository owner.
# Sirius Web and Spring Boot are pinned on purpose (docs/sirius-upgrade-2026.11.md): only patch updates are proposed
# for them, and upgrades go through the documented upgrade task.
version: 2
# Sirius Web's Maven and npm packages are on GitHub Packages, which needs a token: the repository's Dependabot secrets
# GPR_USER (GitHub user name) and GPR_TOKEN (classic PAT with read:packages). Without them Dependabot skips these packages.
registries:
  sirius-web-maven:
    type: maven-repository
    url: https://maven.pkg.github.com/eclipse-sirius/sirius-web
    username: ${{secrets.GPR_USER}}
    password: ${{secrets.GPR_TOKEN}}
  sirius-emf-json-maven:
    type: maven-repository
    url: https://maven.pkg.github.com/eclipse-sirius/sirius-emf-json
    username: ${{secrets.GPR_USER}}
    password: ${{secrets.GPR_TOKEN}}
  github-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.GPR_TOKEN}}
updates:
  - package-ecosystem: gradle
    directory: "/"
    registries:
      - sirius-web-maven
      - sirius-emf-json-maven
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "org.eclipse.sirius:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.springframework.boot*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: npm
    directory: "/frontend"
    registries:
      - github-npm
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@eclipse-sirius/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
