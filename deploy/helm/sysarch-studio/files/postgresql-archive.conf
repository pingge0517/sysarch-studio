# WAL archiving for point-in-time recovery (P2 T8, spec §7.3 "WAL 归档"). Included by the chart's PostgreSQL;
# for a PostgreSQL outside the chart, add these lines to postgresql.conf (archive directory on its own volume).
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f'
archive_timeout = 300
max_wal_senders = 3
# and in pg_hba.conf, for pg-basebackup.sh: host replication all all scram-sha-256
