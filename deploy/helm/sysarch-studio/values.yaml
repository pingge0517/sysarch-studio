# SysArch Studio Helm values (P2 T8, spec §7.3). Secrets are never written here: create them first (see docs/runbook.md)
# and name them below.

image:
  backend: registry.example.com/sysarch/backend:0.3.0
  frontend: registry.example.com/sysarch/frontend:0.3.0
  postgres: postgres:16
  solver: registry.example.com/sysarch/solver:0.4.0   # solver/Dockerfile
  pullPolicy: IfNotPresent

backend:
  replicas: 1            # P2: one instance (edit sessions are serialized per project in the JVM, see CLAUDE.md T2)
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { memory: 3Gi }
  javaOpts: "-XX:MaxRAMPercentage=75"
  # Secret with POSTGRES_USER, POSTGRES_PASSWORD, SYSARCH_SESSION_SECRET and, optionally, POLARION_SYNC_TOKEN,
  # POLARION_WEBHOOK_SECRET. kubectl create secret generic sysarch-backend --from-literal=...
  existingSecret: sysarch-backend
  env:
    POLARION_BASE_URL: https://polarion.example.com/polarion
    CONSISTENCY_STRATEGY: MODEL_WINS
    SYNC_RATE_LIMIT_RPS: "10"
    SYSARCH_AUTH_MODE: polarion          # never dev in a shared deployment
    SYSARCH_SECURE_COOKIE: "true"         # behind HTTPS
    SYSARCH_COOKIE_DOMAIN: sysarch.example.com   # the shell and Sirius Web are two hosts of this domain
    CORS_ALLOWED_ORIGINS: https://sysarch.example.com
    # Polarion project -> Sirius project, one variable per bound project:
    # SYSARCH_POLARION_PROJECTS_SYSARCH: "domain controller"
    # Rollback switches (spec §10), "false" turns one feature off:
    SYSARCH_FEATURE_LOCKS: "true"
    SYSARCH_FEATURE_BRANCHES: "true"
    SYSARCH_FEATURE_REPORTS: "true"
    SYSARCH_FEATURE_IMPORTS: "true"
    SYSARCH_FEATURE_SOLVER: "true"   # P3: parametric solving
    SYSARCH_FEATURE_XMI: "true"      # P3: XMI export
  reports:
    size: 20Gi           # generated reports, kept 90 days by the backend itself
    storageClass: ""

# P3 T4: parametric solving in an isolated pod (no egress, read-only root file system); the backend uses it as the
# remote solver. false = no remote solver (POST /solve with solver=remote answers 503).
solver:
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

frontend:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 64Mi }

ingress:
  enabled: true
  className: nginx
  host: sysarch.example.com
  tlsSecret: sysarch-tls
  # Sirius Web's own UI (diagram editing) is served by the backend; give it its own host so its cookies are shared.
  siriusHost: sirius.sysarch.example.com

postgres:
  # true: a PostgreSQL 16 StatefulSet in this release. false: use the cluster's PostgreSQL (external.url).
  enabled: true
  database: sysarch
  size: 50Gi
  storageClass: ""
  walArchive:
    size: 50Gi           # WAL archive (point-in-time recovery), pruned after retentionDays + 7 days in the database pod
  external:
    url: jdbc:postgresql://postgres.example.com:5432/sysarch

backup:
  enabled: true
  schedule: "30 2 * * *"   # daily full dump (spec §7.3), 02:30
  baseBackupSchedule: "0 3 * * 0"   # weekly base backup for WAL replay
  retentionDays: 30
  size: 100Gi
  storageClass: ""
  # The audit log keeps 365 days; older rows are exported to the backup volume, then removed (monthly).
  auditArchiveSchedule: "0 4 1 * *"
