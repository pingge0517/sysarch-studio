{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sysarch.name" . }}-backup
  labels: {{- include "sysarch.labels" . | nindent 4 }}
data:
  pg-backup.sh: |
{{ .Files.Get "files/pg-backup.sh" | indent 4 }}
  pg-basebackup.sh: |
{{ .Files.Get "files/pg-basebackup.sh" | indent 4 }}
  pg-restore.sh: |
{{ .Files.Get "files/pg-restore.sh" | indent 4 }}
  audit-archive.sh: |
{{ .Files.Get "files/audit-archive.sh" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sysarch.name" . }}-backups
  labels: {{- include "sysarch.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.backup.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.backup.size }} } }
{{- range $job := list (dict "name" "backup" "schedule" $.Values.backup.schedule "script" "pg-backup.sh")
                      (dict "name" "basebackup" "schedule" $.Values.backup.baseBackupSchedule "script" "pg-basebackup.sh" "replication" true)
                      (dict "name" "audit-archive" "schedule" $.Values.backup.auditArchiveSchedule "script" "audit-archive.sh") }}
{{- if or (not $job.replication) $.Values.postgres.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sysarch.name" $ }}-{{ $job.name }}
  labels: {{- include "sysarch.labels" $ | nindent 4 }}
spec:
  schedule: {{ $job.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: {{ $job.name }}
              image: {{ $.Values.image.postgres }}
              command: ["sh", "/scripts/{{ $job.script }}"]
              env:
                {{- include "sysarch.pgEnv" $ | nindent 16 }}
                - { name: BACKUP_DIR, value: /backups }
                - { name: ARCHIVE_DIR, value: /backups/audit }
                - { name: RETENTION_DAYS, value: {{ $.Values.backup.retentionDays | quote }} }
              volumeMounts:
                - { name: scripts, mountPath: /scripts }
                - { name: backups, mountPath: /backups }
          volumes:
            - name: scripts
              configMap: { name: {{ include "sysarch.name" $ }}-backup }
            - name: backups
              persistentVolumeClaim: { claimName: {{ include "sysarch.name" $ }}-backups }
{{- end }}
{{- end }}
{{- end }}
